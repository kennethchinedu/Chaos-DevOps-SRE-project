apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: server-app-nodeclass


spec:
  amiFamily: AL2
  role: "arn:aws:iam::471112894147:role/karpenter-node-role-prod-eks2"

  # Selects AMIs (latest Amazon Linux 2) for the instances
  amiSelectorTerms:
    - name: "amazon-eks-node-*"
      owners: ["602401143452"]
  


  # Kubelet configurationy
  kubelet:
    podsPerCore: 2
    maxPods: 20
    systemReserved:
      cpu: 100m
      memory: 100Mi
      ephemeral-storage: 1Gi
    kubeReserved:
      cpu: 200m
      memory: 100Mi
      ephemeral-storage: 3Gi
    evictionHard:
      memory.available: 5%
      nodefs.available: 10%
      nodefs.inodesFree: 10%
    evictionSoft:
      memory.available: 500Mi
      nodefs.available: 15%
      nodefs.inodesFree: 15%
    evictionSoftGracePeriod:
      memory.available: 1m
      nodefs.available: 1m30s
      nodefs.inodesFree: 2m
    evictionMaxPodGracePeriod: 60
    imageGCHighThresholdPercent: 85
    imageGCLowThresholdPercent: 80
    cpuCFSQuota: true
    clusterDNS: ["10.0.1.100"]

  # Subnets to attach nodes to (replace with your actual subnets)
  # IMPORTANT: The following tags MUST match the tags on your subnets in AWS.
  # The error \"no subnets found\" indicates that these selectors are not matching any subnets.
  # Please verify the tags on your subnets and update these selectors accordingly.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "prod-eks2"


  # Security groups to attach nodes to (replace with actual SG tags/names)
  # IMPORTANT: The following tags MUST match the tags on your security groups in AWS.
  # Please verify the tags on your security groups and update these selectors accordingly.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "prod-eks2" 
        Environment: "prod"


  # Node tags
  tags:
    project: app
    application: boutique-app

  # Metadata options for IMDS
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  # Storage and networking
  associatePublicIPAddress: false
  detailedMonitoring: false
