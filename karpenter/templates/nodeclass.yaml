apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: server-app
spec:
  amiFamily: AL2

  # Selects AMIs (latest Amazon Linux 2) for the instances
  amiSelectorTerms:
    - tags: {}  

  # Kubelet configuration
  kubelet:
    podsPerCore: 2
    maxPods: 20
    systemReserved:
      cpu: 100m
      memory: 100Mi
      ephemeral-storage: 1Gi
    kubeReserved:
      cpu: 200m
      memory: 100Mi
      ephemeral-storage: 3Gi
    evictionHard:
      memory.available: 5%
      nodefs.available: 10%
      nodefs.inodesFree: 10%
    evictionSoft:
      memory.available: 500Mi
      nodefs.available: 15%
      nodefs.inodesFree: 15%
    evictionSoftGracePeriod:
      memory.available: 1m
      nodefs.available: 1m30s
      nodefs.inodesFree: 2m
    evictionMaxPodGracePeriod: 60
    imageGCHighThresholdPercent: 85
    imageGCLowThresholdPercent: 80
    cpuCFSQuota: true
    clusterDNS: ["10.0.1.100"]

  # Subnets to attach nodes to (replace with your actual subnets)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "prod-eks2"
        environment: "prod"

  # Security groups to attach nodes to (replace with actual SG tags/names)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "prod-eks2"
        environment: "prod"

  # Node tags
  tags:
    project: NovaOps
    application: boutique-app

  # Metadata options for IMDS
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  # Storage and networking
  associatePublicIPAddress: false
  detailedMonitoring: false
