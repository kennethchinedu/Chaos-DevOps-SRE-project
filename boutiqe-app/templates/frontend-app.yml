apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: default
  labels:
    app: frontend-app
    dev: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend
          image: anamskenneth/frontend:2025-07-24
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "product-catalog-service:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currency-service:7000"
            - name: CART_SERVICE_ADDR
              value: "cart-service:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendation-service:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shipping-service:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkout-service:5050"
            - name: AD_SERVICE_ADDR
              value: "ads-service:9555"
          ports:
            - containerPort: 8080
              name: frontend-port
          volumeMounts:
            - name: localvolume
              mountPath: /etc/localdev
      volumes:
        - name: localvolume
          emptyDir: {}
      # nodeSelector:
      #   karpenter.sh/nodepool: server-app-nodepool
      # tolerations:
      #   - key: "example.com/special-taint"
      #     operator: "Exists"
      #     effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
  labels:
    app: frontend-app
spec:
  selector:
    app: frontend-app
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
