apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-app
  namespace: default
  labels:
    app: currency-app
    dev: currencyservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: currency-app
    spec:
      containers:
        - name: currency-app
          image: anamskenneth/currencyservice:2025-07-24
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "7000"
            - name: DISABLE_PROFILER
              value: "1"
            - name: DISABLE_DEBUGGER
              value: "1"
          ports:
            - containerPort: 7000
              name: currency-port
          volumeMounts:
            - name: localvolume
              mountPath: /etc/localdev
      volumes:
        - name: localvolume
          hostPath:
            path: /etc/app
---
apiVersion: v1
kind: Service
metadata:
  name: currency-app
  namespace: default
spec:
  selector:
    app: currency-app
  type: ClusterIP
  ports:
    - port: 7000
      targetPort: 7000
      protocol: TCP
      name: http
