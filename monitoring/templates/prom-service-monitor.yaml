apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cart-service-servicemonitor
  namespace: monitoring                  # Prometheus stack lives here
  labels:
    app: cart-service                    # Used by Prometheus to discover
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: cart-service                  # Must match your Deployment / Service label
  namespaceSelector:
    matchNames:
      - default                          # Namespace where cart-service runs
  endpoints:
    - port: cart-port                     # Must match the Service port name
      path: /metrics                      # Metrics path exposed by your app
      interval: 30s                        # How often Prometheus scrapes
      scrapeTimeout: 10s                   # Optional, max wait per scrape
      scheme: http                         # http/https depending on your service
---