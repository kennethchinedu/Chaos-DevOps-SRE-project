apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-microservices
  namespace: argocd
spec:
  project: microservices-project
  source:
    repoURL: 'https://github.com/your-org/your-repo.git'  # your Git repo
    targetRevision: main                               # branch or tag
    path: multi-microservices-chart                    # path to Helm chart in repo
    helm:
      valueFiles:
        - values.yaml                                  # optionally override values
  destination:
    server: 'https://kubernetes.default.svc'          # target cluster
    namespace: default                                # target namespace
  syncPolicy:
    automated:
      prune: true           # delete resources not in Git
      selfHeal: true        # automatically fix drift
    syncOptions:
      - CreateNamespace=true  # auto-create namespace if missing
