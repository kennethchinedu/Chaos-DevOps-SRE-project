# Namespace-wide VirtualService for internal service-to-service traffic
# We will manage how service is routed and received throughout infra.
# all services will receive: 2 Retry twice,Each try max 300ms & Total timeout 1s
# Applies to all services inside the namespace.
# Handles retries and timeouts for east-west traffic.

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: namespace-wide-internal-routing
  namespace: default
spec:
  hosts:
    - "*"                     # All services in the namespace
  http:
    - route:
        - destination:
            host: "*"         # Matches all destinations
      retries:
        attempts: 1            # Retry once for internal calls
        perTryTimeout: 200ms   # Each retry max 200ms
      timeout: 500ms            # Total request timeout

---

# Handles circuit breaking & connection pools
# Protects all services from cascading failures

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: namespace-wide-circuit-breaker
  namespace: default
spec:
  host: "*"                   
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 20
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3      # Eject if 3 consecutive 5xx errors
      interval: 5s                  # Check every 5 seconds
      baseEjectionTime: 30s         # Keep ejected instance out for 30 seconds
      maxEjectionPercent: 100       # Max % of hosts that can be ejected   